name: Compilar APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compilar (release)
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: iptv-test-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publicar no link fixo (release "latest")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk iptv-test.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest iptv-test.apk \
            --title "IPTV TEST - build ${{ github.run_number }}" \
            --notes "APK mais recente (build ${{ github.run_number }}, commit ${GITHUB_SHA::7})." \
            --target "$GITHUB_SHA"

name: Compilar APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "data/**"
      - "testlists/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # o cartão do app na TV é desenhado a partir do nome em strings.xml: mudou o nome, o cartão acompanha
      - name: Gerar o cartão (banner) com o nome do app
        continue-on-error: true
        run: |
          python3 -c "import PIL" 2>/dev/null || pip install --quiet --break-system-packages pillow
          python3 tools/make_banner.py

      - name: Ler o nome do app
        id: nome
        run: |
          NOME=$(sed -n 's:.*<string name="app_name">\(.*\)</string>.*:\1:p' app/src/main/res/values/strings.xml | head -n1)
          echo "app=${NOME:-IPTV}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compilar (release)
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
        # em caso de erro, mostra as linhas "e: ..." como anotações (fáceis de ler)
      - name: Mostrar erros de compilação
        if: failure()
        run: |
          grep -E "^e: " build.log | sed 's/^e: //' | head -30 | while read -r l; do echo "::error::$l"; done || true

      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: iptv-test-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publicar no link fixo (release "latest")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk iptv-test.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest iptv-test.apk \
            --title "${{ steps.nome.outputs.app }} - build ${{ github.run_number }}" \
            --notes "APK mais recente (build ${{ github.run_number }}, commit ${GITHUB_SHA::7})." \
            --target "$GITHUB_SHA"

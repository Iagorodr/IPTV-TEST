name: Capturar telas

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "tools/shots/**"
      - ".github/workflows/telas.yml"

permissions:
  contents: write

jobs:
  telas:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Compilar (debug)
        run: gradle :app:assembleDebug --no-daemon
      - name: Liberar acesso ao KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador de TV + capturas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          script: bash tools/shots/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telas
          path: shots
      # o ambiente de trabalho não alcança o armazenamento de artefatos: as imagens também vão para um ramo à parte
      - name: Enviar capturas para o ramo telas-img
        if: always()
        run: |
          rm -rf /tmp/img && mkdir /tmp/img && cp -r shots/. /tmp/img/ || true
          cd /tmp/img
          git init -q -b telas-img
          git config user.name "telas-bot"
          git config user.email "telas-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "capturas ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" telas-img
